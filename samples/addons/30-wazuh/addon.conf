# Wazuh agent — the two-phase example: install the agent MSI at build time,
# then enrol it per-VM on first boot with the clone's own identity.
#
# Download the Windows agent MSI from https://packages.wazuh.com/ (or your own
# mirror) and drop it here, then set `file=` to the exact filename.
#
# No WAZUH_MANAGER is passed at build: enrolment (manager address + a unique
# agent name) is deferred to firstboot.ps1 so every clone registers as itself.
#
# Set required=1 if this agent must be present for the template to be valid
# (an AV / inventory agent that "always should be installed"); the build then
# fails if the MSI does not install.
type=msi
file=wazuh-agent-4.12.0-1.msi
timeout=600
codes=0,3010
required=0
firstboot=firstboot.ps1
