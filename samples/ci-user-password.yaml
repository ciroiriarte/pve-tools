#cloud-config
# User-data for a Linux VM: password authentication scenario.
#
# Hostname is NOT set here — it comes from PVE via meta-data (the VM name).
#
# IMPORTANT: using cicustom user= REPLACES PVE's auto-generated user-data.
# PVE's Cloud-Init UI password field is ignored — set the password here.
#
# Generate a hashed password before using this file:
#   openssl passwd -6 'mypassword'
#   # or: python3 -c "import crypt; print(crypt.crypt('mypassword', crypt.mksalt(crypt.METHOD_SHA512)))"
#
# Apply to a VM:
#   qm set <vmid> --cicustom "user=local:snippets/ci-user-password.yaml"
#   qm cloudinit update <vmid>
#   qm start <vmid>

# Timezone — PVE has no native cloud-init timezone option; set it here.
# See: timedatectl list-timezones
timezone: UTC

users:
  - default
  - name: cloudadmin
    gecos: Cloud Administrator
    # 'sudo'  grants sudo on Debian / Ubuntu
    # 'wheel' grants sudo on Rocky / Oracle / openSUSE
    # cloud-init silently ignores groups that do not exist on the target distro
    groups: [sudo, wheel]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    # Hashed password (SHA-512). Replace with output of: openssl passwd -6 'yourpassword'
    passwd: "$6$rounds=4096$REPLACETHISSALT$REPLACETHISHASHWITHTHEOUTPUTOFOPENSSLPASSWD6YourActualPassword"
    lock_passwd: false

# Allow SSH password authentication
ssh_pwauth: true

# Force password change on first login (optional — remove to keep the password as-is)
chpasswd:
  expire: false

package_update: true
package_upgrade: true
